# מרים קונטיינר SQL Server זמני - נחוץ רק לשלב ה-‎ETL החד-פעמי
# (etl/restore_and_export.py, לפי ההוראות ב-‎DATA_SETUP.md), לא לריצה
# הרגילה של האתר. מחזיק את קובץ ה-.bak מ-./data/raw כדי שיהיה אפשר
# לשחזר אותו בתוך הקונטיינר.
services:
  wwi-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: wwi-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "IntelliSales!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ./data/raw:/var/opt/mssql/backup
